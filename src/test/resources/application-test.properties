# Bruges kun naar testen koerer med @ActiveProfiles("test").
# Arver ellers alt fra application.properties (JPA/H2-opsaetning, data.sql osv.)
# og overskriver kun det, der er noedvendigt for at koere in-process.

# port=-1 betyder: bind IKKE en rigtig TCP-port under testen.
grpc.server.port=-1
grpc.server.in-process-name=test

# Klienten i testen taler til serveren via JVM'ens hukommelse, ikke netvaerket.
grpc.client.inProcess.address=in-process:test

# Egen in-memory database til testen, saa den ikke kan kollidere med en
# database fra en samtidig koerende "rigtig" instans af appen.
spring.datasource.url=jdbc:h2:mem:traceability-test;DB_CLOSE_DELAY=-1
