# Standardporten for net.devh grpc-server-spring-boot-starter er 9090.
# Vi saetter den eksplicit, saa den staar klart og tydeligt.
grpc.server.port=9090

spring.application.name=traceability

# --- Database (H2, in-memory) ---
# DB_CLOSE_DELAY=-1 betyder databasen lever saa laenge JVM'en koerer,
# ikke bare saa laenge en enkelt connection er aaben.
spring.datasource.url=jdbc:h2:mem:traceability;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate opretter tabellerne ud fra @Entity-klasserne ved opstart.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Vigtigt: koer data.sql (seed-data) EFTER Hibernate har oprettet tabellerne,
# ellers fejler INSERT'ene fordi tabellerne ikke findes endnu.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Bemaerk: H2-webkonsollen ("/h2-console") kraever spring-boot-starter-web
# (en http-server), som vi bevidst IKKE har med her, da projektet kun er
# gRPC. Vil du kigge i databasen visuelt, kan du tilfoeje starter-web
# midlertidigt, eller bruge en JUnit-test/repository-kald til at verificere.