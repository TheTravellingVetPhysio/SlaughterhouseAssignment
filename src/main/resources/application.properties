grpc.server.port=9090
spring.application.name=traceability

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/traceability
spring.datasource.username=slaughter
spring.datasource.password=slaughter

# create = tabellerne droppes og oprettes forfra ved hver opstart,
# og data.sql seeder dem igen. Giver en ren, forudsigelig database under udvikling.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always